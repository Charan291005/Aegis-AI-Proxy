version: '3.8'

services:
  aegis-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-mcp-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AEGIS_GATEWAY_TOKEN=${AEGIS_GATEWAY_TOKEN:-aegis_super_secret_bearer_token_2026_demo}
      - AEGIS_ENV=${AEGIS_ENV:-production}
      - AEGIS_HOST=0.0.0.0
      - AEGIS_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - UPSTREAM_MCP_URL=${UPSTREAM_MCP_URL:-}
      - ENABLE_PII_REDACTION=${ENABLE_PII_REDACTION:-true}
      - ENABLE_SECRETS_REDACTION=${ENABLE_SECRETS_REDACTION:-true}
      - ENABLE_INJECTION_SHIELD=${ENABLE_INJECTION_SHIELD:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
